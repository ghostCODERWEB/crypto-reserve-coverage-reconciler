[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-reserve-coverage-reconciler"
version = "0.1.0"
description = "Reconcile asset-level reserves and customer liabilities with encumbrance exclusions and valuation scenarios."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-reserve-coverage-reconciler = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
